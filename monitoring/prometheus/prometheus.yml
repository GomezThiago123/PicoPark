# Qué junta Prometheus y cada cuánto. Todos los destinos están en la misma VM.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: { instance: picopark-vm }

  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: { instance: picopark-vm }

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels: { instance: picopark-vm }

  # El juego (contenedor picopark-host, puerto publicado 3050) expone GET /metrics.
  - job_name: picopark-host
    static_configs:
      - targets: ["127.0.0.1:3050"]
        labels: { instance: picopark-vm }
