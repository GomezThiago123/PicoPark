# Stack de monitoreo de la VM: Prometheus + Node Exporter + cAdvisor + Grafana.
#
# Lo despliega monitoring/desplegar.sh (workflow "Monitoreo") en ~/picopark-monitoreo.
# Ver docs/07-monitoreo.md.
#
# Todos usan la red del host. Prometheus, Node Exporter y cAdvisor escuchan solo en
# 127.0.0.1: desde la red únicamente se llega a Grafana, que pide usuario y contraseña.
#
# La VM es compartida y otros proyectos ya usan 9090/9100 (los puertos estándar),
# por eso acá se usan 19090 (Prometheus), 19100 (Node Exporter) y 18081 (cAdvisor).
name: picopark-monitoreo

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: monitoreo-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=500MB
      - --web.listen-address=127.0.0.1:19090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Métricas de la VM: CPU, memoria, disco, red.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoreo-node-exporter
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:19100
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  # Métricas de cada contenedor: CPU, memoria, red, reinicios.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: monitoreo-cadvisor
    network_mode: host
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - -listen_ip=127.0.0.1
      - -port=18081
      - -docker_only=true
      - -housekeeping_interval=15s
      - -store_container_labels=false
      - -enable_metrics=cpu,memory,network,diskIO
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    container_name: monitoreo-grafana
    network_mode: host
    environment:
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3060}
      - GF_SECURITY_ADMIN_USER=admin
      # Solo se aplica la primera vez que arranca (cuando se crea la base de Grafana).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?definir GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/picopark.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
