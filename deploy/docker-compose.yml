# Compose para la VM: usa la imagen publicada en GHCR, no construye nada.
#
# Lo maneja deploy/desplegar.sh (CD), que lo copia a ~/picopark-deploy junto con
# un .env que fija IMAGE_TAG. Para operar a mano en la VM:
#   cd ~/picopark-deploy && docker compose ps
name: picopark-host

services:
  picopark-host:
    image: ghcr.io/gomezthiago123/picopark-host:${IMAGE_TAG:?definir IMAGE_TAG (sha-xxxxxxx o X.Y.Z)}
    container_name: picopark-host
    ports:
      - "${HOST_PORT:-3050}:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
